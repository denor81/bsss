# systemd 249-style vendor path and an earlier administrator drop-in
# /lib/systemd/resolved.conf.d/10-local.conf
[Resolve]
DNS=192.0.2.53
FallbackDNS=192.0.2.54
Domains=example.internal
DNSOverTLS=opportunistic
DNSSEC=allow-downgrade
LLMNR=resolve
MulticastDNS=yes

# /etc/systemd/resolved.conf.d/99-bsss-dot.conf
[Resolve]
DNS=
DNS=8.8.8.8#dns.google 1.1.1.1#one.one.one.one
FallbackDNS=
Domains=
Domains=~.
DNSOverTLS=yes
DNSSEC=no
LLMNR=no
MulticastDNS=no
