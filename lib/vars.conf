readonly DNS_QUERY_TIMEOUT_SECONDS=15
readonly DNS_WATCHDOG_TIMEOUT_SECONDS=60
readonly DNS_TEST_DOMAIN="example.com"
readonly ROLLBACK_MODULE_NAME="rollback.sh"
readonly ROLLBACK_TIMER_SECONDS=4
