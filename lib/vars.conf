readonly UPDATE_CONNECT_TIMEOUT=10
readonly UPDATE_REQUEST_TIMEOUT=30
readonly UPDATE_DOWNLOAD_TIMEOUT=120
readonly UPDATE_TEMP_DIR="/tmp"

readonly I18N_DIR="${PROJECT_ROOT}/lib/i18n"
readonly LANG_FILE="${PROJECT_ROOT}/.lang"
declare -gA I18N_MESSAGES=() # Массив переводов
source "${PROJECT_ROOT}/lib/i18n/critical/common.sh" # Критические сообщения

readonly UTILS_DIR="utils"
readonly MODULES_DIR="modules"
readonly MODULES_MASK='*.sh' # nullglob mask
readonly MODULE_TYPE_MODIFY="modify"
readonly MODULE_TYPE_CHECK="check"

readonly UNINSTALL_PATHS=".uninstall_paths"

readonly OS_RELEASE_FILE_PATH="/etc/os-release"
readonly ALLOWED_SYS="ubuntu|20"

readonly REBOOT_REQUIRED_FILE_PATH="/var/run/reboot-required"
readonly HOSTNAME_FILE_PATH="/etc/hostname"
readonly HOSTS_FILE_PATH="/etc/hosts"
readonly HOSTNAME_BACKUP_PATH="/etc/hostname.bsss_backup.bak"
readonly HOSTS_BACKUP_PATH="/etc/hosts.bsss_backup.bak"
readonly CLOUD_INIT_CONFIG_FILE="/etc/cloud/cloud.cfg"
readonly CLOUD_INIT_CONFIGD_DIR="/etc/cloud/cloud.cfg.d"
readonly CLOUD_INIT_DISABLED_FILE="/etc/cloud/cloud-init.disabled"
readonly BSSS_CLOUD_INIT_HOSTNAME_FILE="${CLOUD_INIT_CONFIGD_DIR}/99-bsss-preserve-hostname.cfg"
readonly BSSS_HOSTNAME_REBOOT_PKG_NAME="${UTIL_NAME}-hostname"
readonly SWAPFILE_PATH="/swapfile"
readonly SWAPFILE_SIZE="2G"
readonly SWAPFILE_FSTAB_PATH="/etc/fstab"
readonly SWAPFILE_FSTAB_ENTRY="/swapfile none swap sw 0 0"
readonly APT_AUTO_UPGRADES_FILE="/etc/apt/apt.conf.d/20auto-upgrades"
readonly APT_UNATTENDED_UPGRADES_FILE="/etc/apt/apt.conf.d/50unattended-upgrades"
readonly APT_AUTO_UPGRADES_BACKUP="/etc/apt/apt.conf.d/20auto-upgrades.bsss_backup.bak"
readonly APT_UNATTENDED_UPGRADES_BACKUP="/etc/apt/apt.conf.d/50unattended-upgrades.bsss_backup.bak"

readonly GRUB_CONFIGD_DIR="/etc/default/grub.d"
readonly BSSS_IPV6_GRUB_FILE_NAME="-bsss-ipv6-disable.cfg"
readonly BSSS_IPV6_GRUB_FILE_MASK='*-bsss-ipv6-disable.cfg' # nullglob mask
readonly BSSS_IPV6_REBOOT_PKG_NAME="${UTIL_NAME}-ipv6"

readonly DEFAULT_SSH_PORT=22
readonly SSH_CONFIG_FILE="/etc/ssh/sshd_config"
readonly SSH_CONFIG_DIR="/etc/ssh"
readonly SSH_CONFIGD_DIR="/etc/ssh/sshd_config.d"
readonly BSSS_PERMISSIONS_CONFIG_FILE_NAME="-bsss-permissions.conf"
readonly BSSS_PERMISSIONS_CONFIG_FILE_MASK='*-bsss-permissions.conf' # nullglob mask
readonly BSSS_SSH_CONFIG_FILE_NAME="40-bsss-ssh-port.conf"
readonly BSSS_SSH_CONFIG_FILE_MASK='*bsss-ssh-port.conf' # nullglob mask
readonly SSH_CONFIG_FILE_MASK='*.conf' # nullglob mask
readonly BSSS_MARKER_COMMENT="Generated by ${UTIL_NAME^^}"
readonly DNS_RESOLVED_CONFIG_DIR="/etc/systemd/resolved.conf.d"
readonly BSSS_DNS_CONFIG_FILE_NAME="99-bsss-dot.conf"
readonly BSSS_DNS_CONFIG_FILE="${DNS_RESOLVED_CONFIG_DIR}/${BSSS_DNS_CONFIG_FILE_NAME}"
readonly BSSS_DNS_ROLLBACK_FILE="${BSSS_DNS_CONFIG_FILE}.bsss_backup"
readonly DNS_RESOLV_CONF_PATH="/etc/resolv.conf"
readonly DNS_RESOLVED_STUB_PATH="/run/systemd/resolve/stub-resolv.conf"
readonly DNS_RESOLVED_SERVICE="systemd-resolved.service"
readonly DNS_SUPPORTED_UBUNTU_VERSIONS="22.04|24.04|26.04"
readonly DNS_PROFILE_GOOGLE_CLOUDFLARE="google-cloudflare"
readonly DNS_PROFILE_YANDEX_GOOGLE="yandex-google"
readonly DNS_DEFAULT_PROFILE="$DNS_PROFILE_GOOGLE_CLOUDFLARE"
readonly DNS_SERVERS_GOOGLE_CLOUDFLARE="8.8.8.8#dns.google 1.1.1.1#one.one.one.one"
readonly DNS_SERVERS_YANDEX_GOOGLE="77.88.8.8#common.dot.dns.yandex.net 8.8.8.8#dns.google"
