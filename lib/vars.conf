# Например: "utils", "modules", но не "/utils" или "utils/"

readonly CURRENT_MODULE_NAME="$(basename "$0")"
readonly UTIL_NAME="bsss"
readonly BSSS_VERSION="dev"
readonly BSSS_REPO_URL="https://github.com/denor81/bsss"
readonly BSSS_LATEST_RELEASE_URL="${BSSS_REPO_URL}/releases/latest"
readonly BSSS_RELEASE_TAG_URL="${BSSS_REPO_URL}/releases/tag"
